name: Android CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "phase7-ci-quality", "phase8-compliance" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-screen-test-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Assemble screen-test app and instrumentation APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          python3 scripts/record_screen_test_artifacts.py
      - name: Upload screen-test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: espresso-screen-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            build/screen-tests/package-evidence.json
          if-no-files-found: error

  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'gradle-9.3.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Android Lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug --no-daemon
          result=$?
          if [ "$result" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "::group::Android lint errors"
              cat "$report"
              echo "::endgroup::"
            fi
          fi
          exit "$result"

      - name: Draft store metadata and device evidence schema
        run: python3 scripts/verify_publication_ready.py --draft
        shell: bash

      - name: Verify API capability matrix against Retrofit routes
        run: |
          python3 scripts/verify_api_capability_matrix.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
        shell: bash

      - name: Five-language resources and UI label gate
        run: python3 scripts/verify_localization.py
        shell: bash

      - name: Legal draft integrity and acceptance revision
        run: python3 scripts/verify_legal_assets.py
        shell: bash

      - name: Unit, Contract, Compose and Screenshot Tests
        run: ./gradlew :app:testDebugUnitTest :app:jacocoTestReport -Proborazzi.test.record=true --no-daemon
        shell: bash

      - name: Verify actual test, screenshot and coverage evidence
        run: python3 scripts/verify_test_evidence.py
        shell: bash

      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --no-daemon
        shell: bash

      - name: Compile release-like Macrobenchmark harness
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark --no-daemon
        shell: bash

      - name: Upload UI branding screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-branding-screenshots
          path: |
            app/build/outputs/roborazzi/branding/*.png
            app/build/outputs/roborazzi/localization/*.png
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Release (unsigned on CI)
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest --no-daemon
        shell: bash

      - name: Release Dependency and Privacy SDK Gate
        run: bash scripts/verify_release_dependencies.sh
        shell: bash

      - name: Verify bundled full license and NOTICE distribution
        run: python3 scripts/prepare_bundled_notices.py --check
        shell: bash

      - name: Record actual package, manifest and signature evidence
        run: python3 scripts/record_package_evidence.py
        shell: bash

      - name: Reject test DEX types and validate against real test APK
        run: python3 scripts/release_dex_audit.py
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@ce71ff9eda12bc48837b2855bca31364cdfa93e2 # v1.0.0

      - name: Snyk High-Severity Dependency Gate
        run: |
          snyk test --sub-project=app --configuration-matching='^releaseRuntimeClasspath$' --project-name=open-source-client-for-nextdns-app-release --severity-threshold=high --json-file-output=build/compliance/snyk-app-release.json -- --no-daemon
          python3 scripts/verify_snyk_scope.py
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Monitor Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: snyk monitor --sub-project=app --configuration-matching='^releaseRuntimeClasspath$' --project-name=open-source-client-for-nextdns-app-release -- --no-daemon
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Signed release payload security on Android emulator
        run: bash scripts/run_release_runtime_audit.sh
        shell: bash

      - name: Upload resolved release and device-test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit-and-device-tests
          path: |
            build/compliance/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/benchmark/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
